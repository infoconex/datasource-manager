name: Foundation CI

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    name: Portable build, package, consumer, NUnit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: |
            11.0.x
            10.0.x
      - uses: NuGet/setup-nuget@d105a947828025cd7a980103c35ba2bfae586d0f
        if: runner.os == 'Windows'
      - name: Verify portable assemblies and packed consumer
        shell: pwsh
        run: ./eng/verify.ps1 -Stage Portable
      - name: Verify actual legacy .NET Framework 4.8 consumer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./eng/verify.ps1 -Stage WindowsLegacy

