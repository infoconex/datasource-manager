name: Documentation

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'eng/check-docs.ps1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate ADRs, scenarios and Markdown links
        shell: pwsh
        run: ./eng/check-docs.ps1

