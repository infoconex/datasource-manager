name: Documentation

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'eng/check-docs.ps1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate ADRs, scenarios and Markdown links
        shell: pwsh
        run: ./eng/check-docs.ps1

