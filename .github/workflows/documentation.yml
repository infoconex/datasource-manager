name: Documentation

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'eng/check-docs.ps1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Validate ADRs, scenarios and Markdown links
        shell: pwsh
        run: ./eng/check-docs.ps1

